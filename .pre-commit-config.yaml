# Checks that run on `git commit`. Install once with:
#   uv run --directory backend pre-commit install
# Run on everything by hand:
#   uv run --directory backend pre-commit run --all-files
# CI runs the same checks again; hooks can be skipped locally, CI can't.

repos:
  # Generic hygiene for every file in the repo
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]  # two trailing spaces are a line break in Markdown
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # Python checks run through uv, so they use the exact versions in backend/uv.lock
  # and mypy sees the real dependencies (FastAPI, SQLAlchemy, Pydantic).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
