# Local stack. Start everything with: docker compose up -d --build
# Day-to-day dev can still run only the DB (docker compose up -d db) plus `uv run uvicorn --reload`.

# Shared settings for the two services built from backend/Dockerfile
x-backend: &backend
  build: ./backend
  image: market-desk-api
  environment:
    # Host is the service name `db`: inside a container, localhost is the container itself
    DATABASE_URL: postgresql+psycopg://market_desk:market_desk@db:5432/market_desk

services:
  db:
    # Postgres 16 with the pgvector extension preinstalled (embeddings in Sprint 3)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: market_desk
      POSTGRES_PASSWORD: market_desk   # local-only credentials, never used in the cloud
      POSTGRES_DB: market_desk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_desk -d market_desk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job: apply migrations, then exit. Mirrors the one-off ECS task in Sprint 7.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    environment:
      # Replaces the anchor's environment, so DATABASE_URL is repeated here
      DATABASE_URL: postgresql+psycopg://market_desk:market_desk@db:5432/market_desk
      # The filing check (task 7). Service names, not localhost: this runs in a container
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/market-desk
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:-}
      FILING_CHECK_INTERVAL_MINUTES: ${FILING_CHECK_INTERVAL_MINUTES:-0}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Workflow automation (Sprint 1 task 6): receives our signed events and posts to Slack.
  # UI at http://localhost:5678. Workflows live in the repo and are imported (see n8n/README.md).
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6   # pinned: `latest` moves every week
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Madrid      # for schedule nodes
      TZ: Europe/Madrid
      WEBHOOK_URL: http://localhost:5678/  # the base URL the UI shows for webhook nodes
      N8N_DIAGNOSTICS_ENABLED: "false"     # no telemetry
      # The signature check is a Code node: it needs Node's crypto module and $env
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Only the two secrets n8n needs, read from .env by compose (not the whole file)
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n           # n8n's own SQLite DB, credentials and settings
      - ./n8n:/n8n                         # workflows and scripts: imported from here, exported back

volumes:
  pgdata:
  n8n_data:
